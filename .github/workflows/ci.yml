name: CI - Quality Gates

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Evite de faire tourner plusieurs fois le meme workflow sur la meme branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Lint & Formatting
  # Double filet de securite : verifie ce que husky/lint-staged fait en local
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  # ─────────────────────────────────────────────
  # JOB 2 : Tests unitaires & integration + couverture
  # Verifie le seuil de 70% de couverture
  # ─────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3 : Tests E2E (Playwright)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4 : Analyse statique SonarCloud
  # Quality Gate : 0 bugs, 0 vulnerabilites, duplication < 3%, couverture >= 70%
  # S'execute apres les tests pour avoir le rapport de couverture
  # ─────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Necessaire pour que SonarCloud puisse analyser l'historique git (blame)
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (pour lcov.info)
        run: npm run test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 5 : Scan de securite des dependances (Snyk)
  # Le pipeline echoue si une vulnerabilite CRITIQUE est detectee
  # ─────────────────────────────────────────────
  security:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest
    # S'execute en parallele de sonarcloud, independamment des tests
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Echoue le pipeline si une vulnerabilite HIGH ou CRITICAL est detectee
          args: --severity-threshold=high

      - name: Upload Snyk results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 6 : Build de l'image Docker
  # Valide que le Dockerfile compile correctement
  # S'execute apres le lint (code valide = pas la peine de builder)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # On tag avec le SHA du commit pour la tracabilite
          tags: tp3-cicd:${{ github.sha }}
          # Cache entre les runs pour accelerer les builds suivants
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # On exporte l'image pour que Trivy puisse la scanner
          load: true

      - name: Display image size
        run: docker image inspect tp3-cicd:${{ github.sha }} --format='Image size: {{.Size}} bytes'

  # ─────────────────────────────────────────────
  # JOB 7 : Scan de vulnerabilites de l'image Docker (Trivy)
  # Scanne l'image finale pour les CVE dans l'OS et les librairies
  # Echoue si une vulnerabilite CRITIQUE est detectee
  # ─────────────────────────────────────────────
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tp3-cicd:${{ github.sha }}
          cache-from: type=gha
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tp3-cicd:${{ github.sha }}
          format: table
          # Le pipeline echoue sur les vulnerabilites CRITIQUES dans l'image Docker
          exit-code: "1"
          severity: CRITICAL
          # Ignorer les vuln sans correctif disponible (pour eviter les faux positifs bloquants)
          ignore-unfixed: true

      - name: Run Trivy - rapport complet SARIF (sans bloquer)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: tp3-cicd:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 7
