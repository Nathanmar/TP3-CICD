name: CI - Quality Gates

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Lint & Formatting
  # Double check formatting and linting
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  # ─────────────────────────────────────────────
  # JOB 2 : Tests unitaires & integration + couverture
  # Enforce 70% coverage threshold
  # ─────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3 : Tests E2E (Playwright)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4 : Analyse statique SonarCloud
  # Quality Gate : 0 bugs, 0 vulnerabilites, duplication < 3%, couverture >= 70%
  # Requires test coverage report
  # ─────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Required for SonarCloud blame information
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 5 : Scan de securite des dependances (Snyk)
  # Fails pipeline on CRITICAL vulnerabilities
  # ─────────────────────────────────────────────
  security:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest
    # Runs in parallel with sonarcloud
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Fail on HIGH or CRITICAL vulnerabilities
          args: --severity-threshold=high

      - name: Upload Snyk results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 6 : Build de l'image Docker
  # Validates Dockerfile compilation
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Tag with commit SHA
          tags: data-mock:${{ github.sha }}
          # Use GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Export image for Trivy scan
          load: true

      - name: Display image size
        run: docker images data-mock:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 7 : Scan de vulnerabilites de l'image Docker (Trivy)
  # Scans image for OS and library CVEs
  # ─────────────────────────────────────────────
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: data-mock:${{ github.sha }}
          cache-from: type=gha
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: data-mock:${{ github.sha }}
          format: table
          # Fail on CRITICAL vulnerabilities
          exit-code: "1"
          severity: CRITICAL
          # Ignore unfixed vulnerabilities
          ignore-unfixed: true

      - name: Run Trivy - full SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: data-mock:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 8 : Continuous Deployment
  # Publishes Docker image to GitHub Container Registry
  # Runs only on push to main (not on PRs)
  # ─────────────────────────────────────────────
  deploy:
    name: CD - Publish Image
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/data-mock:latest
            ghcr.io/${{ steps.owner.outputs.value }}/data-mock:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: echo "Image pushed to ghcr.io/${{ steps.owner.outputs.value }}/data-mock:${{ github.sha }}"
